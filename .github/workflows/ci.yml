name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        otp: ["26", "27", "28", "29"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: ${{ fromJSON('{"26":"3.25.1","27":"3.25.1","28":"3.26","29":"3.27.0"}')[matrix.otp] || '3' }}

      - name: Cache rebar3
        uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-otp-${{ matrix.otp }}-${{ hashFiles('rebar.config', 'rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp-${{ matrix.otp }}-

      - name: Compile
        run: rebar3 as test compile

      - name: Check formatting
        run: rebar3 fmt --check

      - name: EUnit
        run: rebar3 eunit

      - name: Common Test
        run: rebar3 ct

      - name: PropEr
        run: rebar3 as test proper -m esp32cam_prop_tests -n 20
